name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LanTransfer.sln

      - name: Build
        run: dotnet build LanTransfer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LanTransfer.sln --configuration Release --no-build --verbosity normal

  package:
    name: Package ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          dotnet publish src/LanTransfer.Host/LanTransfer.Host.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output "artifacts/${{ matrix.rid }}"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = "${{ github.ref_name }}"
          $rid = "${{ matrix.rid }}"
          $assetName = "lantransfer-$tag-$rid"

          if ($rid.StartsWith("win-")) {
            Compress-Archive -Path "artifacts/$rid/*" -DestinationPath "dist/$assetName.zip" -Force
          } else {
            tar -czf "dist/$assetName.tar.gz" -C "artifacts/$rid" .
          }

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: lantransfer-${{ github.ref_name }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets"
            gh release upload "$tag" dist/* --repo "$repo" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$repo" \
              --title "LanTransfer $tag" \
              --generate-notes \
              --verify-tag
          fi
