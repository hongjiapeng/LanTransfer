<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">
    <title>Xiaowei Remote Chat</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 Xiaowei Assistant</h1>
            <div class="subtitle">Remote Chat Interface</div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connected</span>
            </div>
            <span id="timestamp"></span>
        </div>

        <!-- Notification Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Upload Progress -->
        <div class="upload-progress" id="uploadProgress">
            <div class="progress-header">
                <span class="progress-title">Uploading...</span>
                <button class="progress-cancel" id="cancelUpload" aria-label="Cancel upload">✕</button>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span id="progressPercent">0%</span>
                <span id="progressSize">0 / 0</span>
            </div>
            <div class="file-preview" id="filePreview" style="display: none;">
                <span class="file-preview-icon" id="filePreviewIcon">📄</span>
                <div class="file-preview-info">
                    <div class="file-preview-name" id="filePreviewName"></div>
                    <div class="file-preview-size" id="filePreviewSize"></div>
                </div>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <!-- Messages will be added here dynamically -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Input Area (ChatGPT-like) -->
        <div class="input-container">
            <input type="file"
                   id="fileInput"
                   accept="image/*,.pdf,.doc,.docx,.txt,.zip"
                   aria-label="File input">

            <button class="icon-button" id="uploadButton" aria-label="Upload file" title="Upload">
                <span class="upload-icon">+</span>
            </button>

            <div class="input-wrapper">
                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Xiaowei..."
                    autocomplete="off"
                    aria-label="Message input"></textarea>
            </div>

            <button class="icon-button primary" id="sendButton" aria-label="Send message" title="Send" disabled>
                <span class="send-icon">↑</span>
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script src="js/app.js"></script>
</body>
</html>
