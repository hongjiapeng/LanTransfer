<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <title>文件传输助手</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="top-bar">
            <div>
                <h1>文件传输助手</h1>
                <p id="serverUrl">正在读取连接地址</p>
            </div>
            <div class="status-pill" aria-live="polite">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">连接中</span>
            </div>
        </header>

        <section class="workspace">
            <section class="transfer-pane" aria-labelledby="uploadTitle">
                <div class="section-heading">
                    <div>
                        <h2 id="uploadTitle">发送文件</h2>
                        <p id="uploadLimit">单文件上限读取中</p>
                    </div>
                    <button class="icon-button" id="refreshButton" type="button" title="刷新接收箱" aria-label="刷新接收箱">
                        <span aria-hidden="true">↻</span>
                    </button>
                </div>

                <label class="drop-zone" id="dropZone" for="fileInput">
                    <input type="file" id="fileInput" multiple>
                    <span class="drop-symbol" aria-hidden="true">+</span>
                    <span class="drop-title">选择或拖放文件</span>
                    <span class="drop-meta">发送到当前设备</span>
                </label>

                <div class="progress-panel" id="progressPanel" hidden>
                    <div class="progress-row">
                        <span id="progressName">准备上传</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="progress-size" id="progressSize">0 / 0</div>
                </div>

                <div class="notice" id="notice" hidden></div>
            </section>

            <section class="inbox-pane" aria-labelledby="inboxTitle">
                <div class="section-heading">
                    <div>
                        <h2 id="inboxTitle">接收箱</h2>
                        <p id="inboxMeta">暂无文件</p>
                    </div>
                </div>

                <div class="file-list" id="fileList" aria-live="polite"></div>
            </section>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
